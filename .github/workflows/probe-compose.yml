name: Probe Compose Toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Compile mobile debug Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Compile probe
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileMobileArm64_v8aDebugKotlin --no-daemon
