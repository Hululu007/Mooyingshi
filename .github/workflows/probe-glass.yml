name: Probe Glass Assemble
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Android SDK
        run: |
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools"
          curl -sL -o /tmp/p37.zip "https://dl.google.com/android/repository/platform-37_r02.zip"
          rm -rf "$SDK/platforms/android-37"
          unzip -q /tmp/p37.zip -d /tmp/p37
          mv /tmp/p37/android-37 "$SDK/platforms/android-37"
          sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/' "$SDK/platforms/android-37/source.properties" 2>/dev/null || true
          cat "$SDK/platforms/android-37/source.properties" | head -12
      - name: Assemble mobile arm64 debug
        run: ./gradlew :app:assembleMobileArm64_v8aDebug --stacktrace
